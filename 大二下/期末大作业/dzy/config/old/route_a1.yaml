steps:
- name: left_channel_entry
  type: transition
  waypoint: left_channel_entry
  position_only: true
  wait_after: 0.0

- name: left_channel_exit
  type: transition
  waypoint: left_channel_exit
  position_only: true
  wait_after: 0.0

- name: a1_text_view
  type: task
  waypoint: a1_text_view
  wait_after: 5.0
  hook:
    module: a_text
    start_topic: /a_text/start
    msg_type: Bool
    value: true
    result_topic: /a_text/result
    wait_result: false

- name: a1_to_b2_mid
  type: transition
  waypoint: a1_to_b2_mid
  position_only: true
  wait_after: 0.0

- name: b2_face_view
  type: task
  waypoint: b2_face_view
  wait_after: 5.0
  hook:
    module: b2_face
    start_topic: /b2_face/start
    msg_type: Bool
    value: true
    result_topic: /b2_face/result
    wait_result: false

- name: b2_to_b1_mid
  type: transition
  waypoint: b2_to_b1_mid
  position_only: true
  wait_after: 0.0

- name: b1_fruit_view
  type: task
  waypoint: b1_fruit_view
  wait_after: 5.0
  hook:
    module: b1_fruit
    start_topic: /b1_fruit/start
    msg_type: Bool
    value: true
    result_topic: /b1_fruit/result
    wait_result: false

- name: b1_to_c_mid
  type: transition
  waypoint: b1_to_c_mid
  position_only: true
  wait_after: 0.0

- name: c_pre_align
  type: align
  waypoint: c_pre_align
  position_only: false
  wait_after: 1.0

- name: c_line_start
  type: task
  waypoint: c_line_start
  position_only: false
  wait_after: 1.0

- name: line_follow
  type: line_follow_launch
  launch_file: "$(find vision_line_follow)/launch/line_follow.launch"
  done_topic: /line_follow/done
  timeout: 45.0
  continue_on_timeout: false

- name: ramp_entry
  type: transition
  waypoint: ramp_entry
  position_only: false
  wait_after: 0.0

- name: ramp_top
  type: transition
  waypoint: ramp_top
  position_only: true
  xy_tolerance: 0.30
  wait_after: 0.0

- name: ramp_exit
  type: transition
  waypoint: ramp_exit
  position_only: true
  xy_tolerance: 0.30
  wait_after: 0.0

- name: d_report
  type: task
  waypoint: d_report
  wait_after: 5.0
  hook:
    module: final_report
    start_topic: /final_report/start
    msg_type: Bool
    value: true
    result_topic: /final_report/done
    wait_result: false